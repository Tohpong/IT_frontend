<!-- Navigation -->
<nav class="top-nav">
  <div class="container">
    <div class="nav-brand">
      <span class="brand-text">ระบบติดตามและนัดหมายเทรนเนอร์</span>
    </div>
    <div class="nav-menu">
      <a routerLink="/home" class="nav-item" routerLinkActive="active">หน้าหลัก</a>
      <a routerLink="/course" class="nav-item" routerLinkActive="active">คอร์ส</a>
      <a routerLink="/trainer" class="nav-item" routerLinkActive="active">เทรนเนอร์</a>
      <a routerLink="/contact" class="nav-item" routerLinkActive="active">ติดต่อ</a>
  <a *ngIf="isLoggedIn && currentUser?.role === 'admin'" routerLink="/admin" class="nav-item" routerLinkActive="active">แอดมิน</a>
    </div>
    
      
  <!-- Login Button (แสดงเมื่อยังไม่ login) -->
  <button *ngIf="!isLoggedIn" class="login-btn" routerLink="/login">เข้าสู่ระบบ</button>
      
      <!-- Mini Profile (แสดงเมื่อ login แล้ว) -->
      <div *ngIf="isLoggedIn" class="profile-dropdown">
        <div class="profile-trigger" (click)="toggleProfileDropdown()">
          <span class="profile-name">{{ currentUser?.username || 'ผู้ใช้' }}</span>
          <svg class="dropdown-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="6,9 12,15 18,9"></polyline>
          </svg>
        </div>
        
        <div class="dropdown-menu" [class.show]="showProfileDropdown">
          <div class="dropdown-item" (click)="goToProfile()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            โปรไฟล์
          </div>
          <!-- My Trainers removed from dropdown -->
          <div class="dropdown-item" routerLink="/workout-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            ประวัติการออกกำลังกาย
          </div>
          <div class="dropdown-item" routerLink="/registration-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
              <polyline points="14,2 14,8 20,8"></polyline>
              <line x1="16" y1="13" x2="8" y2="13"></line>
              <line x1="16" y1="17" x2="8" y2="17"></line>
              <polyline points="10,9 9,9 8,9"></polyline>
            </svg>
            ประวัติการลงทะเบียน
          </div>
          <div class="dropdown-item" routerLink="/booking-history">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="7" width="20" height="15" rx="2" ry="2"></rect>
              <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
            </svg>
            ประวัติการจองเทรนเนอร์
          </div>
          <div class="dropdown-divider"></div>
          <div class="dropdown-item logout" (click)="logout()">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16,17 21,12 16,7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            ออกจากระบบ
          </div>
        </div>
      </div>
    </div>
</nav>
